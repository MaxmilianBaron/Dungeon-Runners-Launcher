name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
          - os: macos-latest
            platform: Mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/Client.Tests -c Release
      - run: dotnet run --project tests/Client.UI.Tests -c Release -- artifacts/ui
      - run: ./tools/Package-Launcher.ps1 -Platform ${{ matrix.platform }}
      - name: Packaged startup
        run: ./tools/Test-Package.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Runners-Launcher-${{ matrix.platform }}
          path: artifacts/Dungeon-Runners-Launcher*.zip
          retention-days: 14
