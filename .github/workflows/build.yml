name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
            artifact: Windows
          - os: ubuntu-22.04
            platform: Linux
            artifact: Linux
          - os: macos-latest
            platform: Mac
            artifact: Mac
          - os: macos-26-intel
            platform: Mac
            artifact: Mac-Intel
          - os: macos-15-intel
            platform: Mac
            artifact: Mac-Intel-15
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Installation filesystem free space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          probe_root=$(mktemp -d "$RUNNER_TEMP/dr-storage.XXXXXX")
          small="$probe_root/small volume"
          normal="$probe_root/normal volume"
          mkdir "$small" "$normal"
          trap 'if mountpoint -q "$small"; then sudo umount "$small"; fi; rmdir "$small" "$normal" "$probe_root"' EXIT
          sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs "$small"
          dotnet run --project Build/Client.StorageCheck -c Release -- "$small" "$normal"
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -property installationPath
          if (-not $installation) { throw 'Visual Studio 2022 is required for the Windows XP toolchain.' }
          $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
          $arguments = @('modify', '--installPath', ('"' + $installation + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64', '--add', 'Microsoft.VisualStudio.Component.WinXP', '--add', 'Microsoft.Component.VC.Runtime.UCRTSDK', '--quiet', '--norestart')
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Native toolchain setup failed: $($process.ExitCode)" }
          $crt = "${env:ProgramFiles(x86)}/Windows Kits/10/Lib/10.0.10240.0/ucrt/x86/libucrt.lib"
          if (-not (Test-Path -LiteralPath $crt)) { throw 'Windows XP static CRT setup did not finish.' }
      - run: ./Build/Package-Launcher.ps1 -Platform ${{ matrix.platform }}
        timeout-minutes: 15
      - name: Native Linux package contents
        if: runner.os == 'Linux'
        run: |
          python3 ./Build/Validate-LinuxNative.py ./artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Native Linux package validation failed.' }
          & sudo apt-get update
          if ($LASTEXITCODE -ne 0) { throw 'Linux package repository refresh failed.' }
          & sudo apt-get install -y ./artifacts/Dungeon-Runners-Launcher-Linux.deb
          if ($LASTEXITCODE -ne 0) { throw 'Native Linux package installation failed.' }
          & xvfb-run -a /usr/lib/dungeon-runners-launcher/DungeonRunnersLauncher --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed native Linux launcher failed.' }
      - name: Packaged startup
        run: |
          if ($IsWindows) {
            $executable = Join-Path $PWD 'artifacts/DungeonRunnersLauncher.exe'
            foreach ($arguments in @(@('--licenses', "$PWD/artifacts/notices.txt"), @('--verify-feed', "$PWD/artifacts/manifest.json"), @('--legacy', '--smoke-test'), @('--smoke-test'))) {
              $process = Start-Process -FilePath $executable -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Packaged startup failed: $($process.ExitCode)" }
            }
          } else {
            $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
            $platform = if ($IsMacOS) { 'osx' } else { 'linux' }
            $executable = Join-Path $PWD "artifacts/DungeonRunnersLauncher-$platform-$architecture"
            & chmod 755 $executable
            if ($LASTEXITCODE -ne 0) { throw 'Launcher permissions failed.' }
            if ($IsLinux) { & xvfb-run -a $executable --smoke-test } else { & $executable --smoke-test }
            if ($LASTEXITCODE -ne 0) { throw 'Packaged startup failed.' }
          }
      - name: Game monitor placement
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: |
          if ($IsLinux) {
            & sudo apt-get install -y libx11-dev openbox
            if ($LASTEXITCODE -ne 0) { throw 'Monitor check dependencies failed.' }
            & xvfb-run -a /bin/sh -c 'openbox >/dev/null 2>&1 & exec pwsh -File ./Build/Check-GameDisplay.ps1'
          } else {
            & ./Build/Check-GameDisplay.ps1
          }
          if ($LASTEXITCODE -ne 0) { throw 'Game monitor placement check failed.' }
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'macOS'
        with:
          name: Runtime-diagnostics-${{ matrix.artifact }}
          path: artifacts/runtime
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        with:
          name: Dungeon-Runners-Launcher-${{ matrix.artifact }}
          path: |
            artifacts/DungeonRunnersLauncher.exe
            artifacts/DungeonRunnersLauncher-linux-*
            artifacts/DungeonRunnersLauncher-osx-*
            artifacts/Dungeon-Runners-Launcher-Mac.dmg
            artifacts/Dungeon-Runners-Launcher-Linux*.AppImage
            artifacts/Dungeon-Runners-Launcher-Linux*.deb
            artifacts/Dungeon-Runners-Launcher-Linux*.rpm
            artifacts/Dungeon-Runners-Launcher-Linux.run
            artifacts/Dungeon-Runners-Launcher-SteamDeck.run
          retention-days: 1
      - name: Draft release installers
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && (matrix.platform != 'Mac' || matrix.os == 'macos-latest')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = ([xml](Get-Content -LiteralPath 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag does not match the launcher version.' }
          $release = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft -or $release.targetCommitish -ne $env:GITHUB_SHA) { throw 'An existing draft release for this exact commit is required.' }
          $names = switch ('${{ matrix.platform }}') {
            Windows { @('DungeonRunnersLauncher.exe') }
            Mac { @('DungeonRunnersLauncher-osx-x64', 'DungeonRunnersLauncher-osx-arm64', 'Dungeon-Runners-Launcher-Mac.dmg') }
            Linux { @('DungeonRunnersLauncher-linux-x64', 'DungeonRunnersLauncher-linux-arm64', 'Dungeon-Runners-Launcher-Linux.AppImage', 'Dungeon-Runners-Launcher-Linux-arm64.AppImage', 'Dungeon-Runners-Launcher-Linux.deb', 'Dungeon-Runners-Launcher-Linux-arm64.deb', 'Dungeon-Runners-Launcher-Linux.rpm', 'Dungeon-Runners-Launcher-Linux-arm64.rpm', 'Dungeon-Runners-Launcher-Linux.run', 'Dungeon-Runners-Launcher-SteamDeck.run') }
          }
          $files = @($names | ForEach-Object { (Get-Item -LiteralPath (Join-Path 'artifacts' $_) -ErrorAction Stop).FullName })
          & gh release upload $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft installer upload failed.' }
