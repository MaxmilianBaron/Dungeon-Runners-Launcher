name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
          - os: macos-latest
            platform: Mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Windows native toolchain
        if: runner.os == 'Windows'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -property installationPath
          if (-not $installation) { throw 'Visual Studio 2022 is required for the Windows XP toolchain.' }
          $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
          $arguments = @('modify', '--installPath', ('"' + $installation + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64', '--add', 'Microsoft.VisualStudio.Component.WinXP', '--add', 'Microsoft.Component.VC.Runtime.UCRTSDK', '--quiet', '--norestart')
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Native toolchain setup failed: $($process.ExitCode)" }
          $crt = "${env:ProgramFiles(x86)}/Windows Kits/10/Lib/10.0.10240.0/ucrt/x86/libucrt.lib"
          if (-not (Test-Path -LiteralPath $crt)) { throw 'Windows XP static CRT setup did not finish.' }
      - run: dotnet run --project tests/Client.Tests -c Release
      - run: dotnet run --project tests/Client.UI.Tests -c Release -- artifacts/ui
      - run: ./tools/Package-Launcher.ps1 -Platform ${{ matrix.platform }}
      - name: Runtime installation
        timeout-minutes: 20
        env:
          WINEDEBUG: -all
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          $root = Join-Path $env:RUNNER_TEMP "runtime game"
          if ($IsMacOS -and $root.StartsWith("/var/")) { $root = "/private" + $root }
          if ($IsLinux) {
            xvfb-run -a dotnet run --project tests/Client.Tests -c Release -- --runtime-integration $root
          } else {
            dotnet run --project tests/Client.Tests -c Release -- --runtime-integration $root
          }
          if ($LASTEXITCODE -ne 0) { throw "Runtime integration failed." }
      - name: Packaged startup
        run: ./tools/Test-Package.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Runners-Launcher-${{ matrix.platform }}
          path: |
            artifacts/DungeonRunnersLauncher.exe
            artifacts/DungeonRunnersLauncher-linux-*
            artifacts/DungeonRunnersLauncher-osx-*
            artifacts/Dungeon-Runners-Launcher-Mac.dmg
            artifacts/Dungeon-Runners-Launcher-Linux*.AppImage
            artifacts/Dungeon-Runners-Launcher-Linux.run
            artifacts/Dungeon-Runners-Launcher-SteamDeck.run
          retention-days: 14
